version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: spicehub_db
    environment:
      POSTGRES_DB: spicehub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - spicehub_network

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: spicehub_backend
    command: >
      sh -c "python manage.py migrate &&
             gunicorn spicehub.wsgi:application --bind 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_ENGINE=postgresql
      - DB_NAME=spicehub_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
      - CORS_ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - db
    networks:
      - spicehub_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: spicehub_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - spicehub_network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  spicehub_network:
    driver: bridge
